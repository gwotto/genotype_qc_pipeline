name: genotype_qc
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - plink=1.90b6
  - plink2
  - r-base>=4.0
  - r-ggplot2
  - r-dplyr
  - r-tidyr
  - r-readr
  - r-patchwork
  - r-tidyverse
  - perl
  - bcftools>=1.17
  - htslib>=1.17       # provides bgzip and tabix
  - openjdk>=11        # required for Cromwell
  # --- QC report (src/genotype_qc_report.qmd) ---------------------------
  - quarto
  - r-knitr
  - r-rmarkdown
  - r-jsonlite         # optional: parses the inputs JSON into the report
